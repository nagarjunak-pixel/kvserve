[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kvserve"
version = "1.0.0"
description = "LLM serving engine simulator: PagedAttention block manager with refcounted automatic prefix caching, Orca continuous batching, Sarathi chunked prefill, recompute preemption and a GQA-aware roofline cost model, with a bit-exact C++20 chained block-hash kernel"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
authors = [{ name = "Nagarjuna Kamireddy", email = "sendemailtonagarjuna@gmail.com" }]
keywords = ["llm-serving", "pagedattention", "kv-cache", "continuous-batching", "prefix-caching", "inference"]
dependencies = [
  "numpy>=1.26.0",
  "pydantic>=2.9.0",
  "fastapi>=0.115.0",
  "uvicorn>=0.32.0",
  "httpx>=0.27.0",
  "typer>=0.12.5",
  "rich>=13.9.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-cov>=5.0.0",
  "hypothesis>=6.115.0",
  "mypy>=1.13.0",
  "ruff>=0.7.0",
]

[project.scripts]
kvserve = "kvserve.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/kvserve"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["kvserve"]
